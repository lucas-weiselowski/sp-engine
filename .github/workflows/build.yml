name: Build & Push

on:
  push:
    branches:
    - main
    tags:
    - "v*"
  schedule:
  - cron: '0 3 * * 1'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Metadata final
      id: meta-final
      uses: docker/metadata-action@v5
      with:
        images: karlender/sp-engine
        tags: |
          type=raw,value=latest
          type=raw,value=latest-final
          type=semver,pattern={{ version }}-final
          type=semver,pattern={{ major }}.{{ minor }}-final

    - name: Docker Metadata slim
      id: meta-slim
      uses: docker/metadata-action@v5
      with:
        images: karlender/sp-engine
        tags: |
          type=raw,value=latest-slim
          type=raw,value=slim
          type=semver,pattern={{ version }}-slim
          type=semver,pattern={{ major }}.{{ minor }}-slim

    - name: Docker Metadata dev
      id: meta-dev
      uses: docker/metadata-action@v5
      with:
        images: karlender/sp-engine
        tags: |
          type=raw,value=latest-dev
          type=raw,value=dev
          type=semver,pattern={{ version }}-dev
          type=semver,pattern={{ major }}.{{ minor }}-dev

    - name: Build & Push final
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .docker/Dockerfile.uv
        target: final
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-final.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push slim
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .docker/Dockerfile.uv
        target: slim
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-slim.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & Push dev
      uses: docker/build-push-action@v5
      with:
        context: .
        file: .docker/Dockerfile.uv
        target: dev
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta-dev.outputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
